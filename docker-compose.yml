name: online-school

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: online_school
      POSTGRES_USER: ${PG_USER:-school_bootstrap}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Generate private .env first}
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:?Generate private .env first}
      APP_MIGRATE_PASSWORD: ${APP_MIGRATE_PASSWORD:?Generate private .env first}
    volumes:
      - pg_data:/var/lib/postgresql
      - ./infra/postgres/00-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [database]

  migrate:
    image: online-school-api:local
    pull_policy: never
    environment:
      DIRECT_URL: postgresql://app_migrate:${APP_MIGRATE_PASSWORD:?Generate private .env first}@postgres:5432/online_school
    command: [sh, -c, 'pnpm prisma migrate deploy && node prisma/seed.mjs']
    depends_on:
      postgres: { condition: service_healthy }
    networks: [database]

  api:
    image: online-school-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      DATABASE_URL: postgresql://app_runtime:${APP_RUNTIME_PASSWORD:?Generate private .env first}@postgres:5432/online_school
      # Only for the requested administrative `exec api pnpm prisma migrate deploy`.
      # The HTTP application's database factory exclusively uses DATABASE_URL.
      DIRECT_URL: postgresql://app_migrate:${APP_MIGRATE_PASSWORD:?Generate private .env first}@postgres:5432/online_school
      CSRF_SIGNING_SECRET: ${CSRF_SIGNING_SECRET:?Generate private .env first}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_ALLOWED_ORIGIN: ${WEBAUTHN_ALLOWED_ORIGIN:-}
    ports: ['127.0.0.1:${API_PORT:-3000}:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    stop_grace_period: 45s
    networks: [database, edge]

  worker:
    image: online-school-worker:local
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://app_runtime:${APP_RUNTIME_PASSWORD:?Generate private .env first}@postgres:5432/online_school
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-10}
      WORKER_RECOVERY_MAX_ATTEMPTS: ${WORKER_RECOVERY_MAX_ATTEMPTS:-10}
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, node, /workspace/infra/worker-health.mjs]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 15s
    stop_grace_period: 45s
    networks: [database, edge]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports: ['127.0.0.1:${HTTP_PORT:-80}:80']
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/http.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/health']
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [edge]

networks:
  database: { internal: true }
  edge: {}
volumes:
  pg_data: {}
